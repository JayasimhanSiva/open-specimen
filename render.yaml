# Render Blueprint: one web service + one PostgreSQL database.
# Secrets are generated by Render or entered in the dashboard; none are stored here.
services:
  - type: web
    name: open-specimen
    runtime: python
    plan: free
    healthCheckPath: /health.json
    # The build downloads the AI model and precomputes the embeddings of every typeface, FAQ and error code
    # (from a throwaway SQLite copy of the seed data), so the small free instance starts answering at once.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      DATABASE_URL=sqlite:////tmp/build.sqlite3 python manage.py migrate --noinput &&
      HF_HUB_OFFLINE=0 DATABASE_URL=sqlite:////tmp/build.sqlite3 python manage.py shell -c
      "from myapp.views import warm_matcher, matcher; warm_matcher(); print('vectors saved:', matcher.save_vectors())"
    # The admin account is created from DJANGO_SUPERUSER_* (set in the Render dashboard); it's skipped if they're
    # empty or the account already exists.
    startCommand: >-
      python manage.py migrate --noinput &&
      (python manage.py createsuperuser --noinput || true) &&
      gunicorn myproject.wsgi --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-specimen-db
          property: connectionString
      - key: MATCHER_CACHE_DIR
        value: /opt/render/project/src/.fastembed_cache
      # The model is downloaded during the build; at runtime load it from disk without asking the Hub.
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: open-specimen-db
    plan: free
